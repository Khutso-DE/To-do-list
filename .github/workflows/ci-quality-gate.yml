name: PR Quality Gate (Lint & Unit Tests)

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff Linter
        run: python -m pip install --upgrade pip ruff

      - name: Run Ruff Syntax & Fatal Lint Checks
        run: ruff check --select E9,F63,F7,F82 .

      - name: Run Unit Tests
        run: python3 -m unittest discover -v -s . -p "test_*.py"
